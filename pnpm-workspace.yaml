packages:
  - packages/*
  - storage/*
  - boilerplate/*

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

configDependencies:
